<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - ResumeSpark</title>
    <script defer src="./app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Create an Account</h2>

    <form id="signupForm" class="space-y-4">
      <input type="text" id="name" placeholder="Full Name" required class="w-full border rounded-lg p-3" />
      <input type="email" id="email" placeholder="Email" required class="w-full border rounded-lg p-3" />
      <input type="password" id="password" placeholder="Password" required class="w-full border rounded-lg p-3" />
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg">
        Sign Up
      </button>
    </form>

    <p class="text-sm text-center mt-4 text-gray-600">
      Already have an account? <a href="signin.html" class="text-blue-600 hover:underline">Sign in</a>
    </p>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
