<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ATS — Simple Resume · ResumeSpark</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
  <style>
    [data-cloak]{display:none!important;}
    @media print {.no-print{display:none!important;}}
    input, textarea {outline: none;}
    body {font-family: 'Inter', sans-serif;}
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

  <!-- HEADER -->
  <header class="no-print bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-xl">RS</div>
        <div>
          <h1 class="text-lg font-semibold">ResumeSpark</h1>
          <p class="text-xs text-gray-500">ATS — Simple Theme</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button id="downloadPdf" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm">Download PDF</button>
        <button id="resetBtn" class="border border-gray-300 px-4 py-2 rounded text-sm">Reset</button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-6xl mx-auto grid md:grid-cols-2 gap-8 p-6">

    <!-- LEFT COLUMN -->
    <section class="space-y-6">

      <!-- PERSONAL -->
      <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
        <h3 class="font-semibold text-blue-700 mb-3">Personal Information</h3>
        <div class="space-y-2">
          <input id="fullName" placeholder="Full Name" class="w-full border p-2 rounded text-sm" />
          <input id="headline" placeholder="Professional Title (e.g. Frontend Developer)" class="w-full border p-2 rounded text-sm" />
          <textarea id="summary" rows="2" placeholder="Professional summary or objective" class="w-full border p-2 rounded text-sm"></textarea>
          <div class="grid sm:grid-cols-3 gap-2">
            <input id="email" placeholder="Email" class="border p-2 rounded text-sm" />
            <input id="phone" placeholder="Phone" class="border p-2 rounded text-sm" />
            <input id="location" placeholder="Location" class="border p-2 rounded text-sm" />
          </div>
          <div class="grid sm:grid-cols-3 gap-2">
            <input id="linkedin" placeholder="LinkedIn" class="border p-2 rounded text-sm" />
            <input id="website" placeholder="Portfolio / Website" class="border p-2 rounded text-sm" />
            <input id="github" placeholder="GitHub (optional)" class="border p-2 rounded text-sm" />
          </div>
        </div>
      </div>

      <!-- EXPERIENCE -->
      <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
        <div class="flex justify-between items-center mb-2">
          <h3 class="font-semibold text-blue-700">Experience</h3>
          <button id="addExp" class="text-blue-600 text-sm">+ Add</button>
        </div>
        <div id="expList" class="space-y-3">
          <template id="expTemplate">
            <div class="exp-item border p-3 rounded">
              <input class="exp-role w-full border p-1 rounded mb-1 text-sm" placeholder="Job Title" />
              <input class="exp-org w-full border p-1 rounded mb-1 text-sm" placeholder="Company" />
              <input class="exp-duration w-full border p-1 rounded mb-1 text-sm" placeholder="Duration (e.g. 2022–Present)" />
              <textarea class="exp-desc w-full border p-1 rounded text-sm" rows="2" placeholder="Key responsibilities or achievements"></textarea>
              <div class="text-right mt-1"><button class="remove-exp text-red-500 text-xs">Remove</button></div>
            </div>
          </template>
        </div>
      </div>

      <!-- EDUCATION -->
      <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
        <div class="flex justify-between items-center mb-2">
          <h3 class="font-semibold text-blue-700">Education</h3>
          <button id="addEdu" class="text-blue-600 text-sm">+ Add</button>
        </div>
        <div id="eduList" class="space-y-3">
          <template id="eduTemplate">
            <div class="edu-item border p-3 rounded">
              <input class="edu-inst w-full border p-1 rounded mb-1 text-sm" placeholder="Institution" />
              <input class="edu-degree w-full border p-1 rounded mb-1 text-sm" placeholder="Degree / Stream" />
              <input class="edu-year w-full border p-1 rounded mb-1 text-sm" placeholder="Duration or Year (e.g. 2021–2025)" />
              <div class="text-right mt-1"><button class="remove-edu text-red-500 text-xs">Remove</button></div>
            </div>
          </template>
        </div>
      </div>

      <!-- SKILLS -->
      <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
        <div class="flex justify-between items-center mb-2">
          <h3 class="font-semibold text-blue-700">Skills</h3>
          <button id="addSkill" class="text-blue-600 text-sm">+ Add</button>
        </div>
        <div id="skillList" class="flex flex-wrap gap-2">
          <template id="skillTemplate">
            <div class="skill-item border rounded px-2 py-1 flex items-center gap-2">
              <input class="skill-input text-sm border-0 focus:outline-none" placeholder="Skill (e.g. React.js)" />
              <button class="remove-skill text-red-500 text-xs">×</button>
            </div>
          </template>
        </div>
      </div>

    </section>

    <!-- RIGHT COLUMN (LIVE PREVIEW) -->
    <aside class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
      <div id="preview" class="p-6">
        <header class="border-b pb-4 mb-4">
          <h1 id="pvName" class="text-2xl font-bold text-gray-900">Full Name</h1>
          <h2 id="pvHeadline" class="text-sm text-gray-600">Professional Title</h2>
          <p id="pvSummary" class="text-sm mt-2 text-gray-700 leading-snug">Professional summary will appear here.</p>
          <div class="mt-3 text-xs text-gray-700 space-y-1">
            <div id="pvEmail">email@example.com</div>
            <div id="pvPhone">+91 12345 67890</div>
            <div id="pvLocation">City, Country</div>
          </div>
          <div class="flex flex-wrap gap-2 mt-3 text-xs text-blue-700 underline">
            <a id="pvLinkedin" href="#">LinkedIn</a>
            <a id="pvWebsite" href="#">Website</a>
            <a id="pvGithub" href="#">GitHub</a>
          </div>
        </header>

        <section>
          <h3 class="font-semibold text-blue-700 mb-2">Experience</h3>
          <ul id="pvExp" class="space-y-2 text-sm"></ul>
        </section>

        <hr class="my-4" />

        <section>
          <h3 class="font-semibold text-blue-700 mb-2">Education</h3>
          <ul id="pvEdu" class="space-y-2 text-sm"></ul>
        </section>

        <hr class="my-4" />

        <section>
          <h3 class="font-semibold text-blue-700 mb-2">Skills</h3>
          <div id="pvSkills" class="flex flex-wrap gap-2 text-sm"></div>
        </section>
      </div>
    </aside>
  </main>

  <script>
    const qs = s => document.querySelector(s);
    const qsa = s => document.querySelectorAll(s);

    function updateProfile(){
      qs('#pvName').textContent = qs('#fullName').value || 'Full Name';
      qs('#pvHeadline').textContent = qs('#headline').value || 'Professional Title';
      qs('#pvSummary').textContent = qs('#summary').value || 'Professional summary will appear here.';
      qs('#pvEmail').textContent = qs('#email').value || 'email@example.com';
      qs('#pvPhone').textContent = qs('#phone').value || '+91 12345 67890';
      qs('#pvLocation').textContent = qs('#location').value || 'City, Country';
      qs('#pvLinkedin').href = qs('#linkedin').value || '#';
      qs('#pvWebsite').href = qs('#website').value || '#';
      qs('#pvGithub').href = qs('#github').value || '#';
    }

    function setup(addBtn, list, template, removeSelector){
      const add = qs(addBtn), container = qs(list), tmpl = qs(template);
      add.addEventListener('click', ()=>{
        const node = tmpl.content.cloneNode(true);
        container.appendChild(node);
        refresh();
      });
      container.addEventListener('click', e=>{
        if(e.target.matches(removeSelector)) e.target.closest('div').remove(), refresh();
      });
    }

    setup('#addExp','#expList','#expTemplate','.remove-exp');
    setup('#addEdu','#eduList','#eduTemplate','.remove-edu');
    setup('#addSkill','#skillList','#skillTemplate','.remove-skill');

    qs('#addExp').click();qs('#addEdu').click();qs('#addSkill').click();

    function refresh(){
      // Experience
      const pvExp = qs('#pvExp');
      pvExp.innerHTML='';
      qsa('#expList .exp-item').forEach(n=>{
        const role=n.querySelector('.exp-role').value,org=n.querySelector('.exp-org').value,dur=n.querySelector('.exp-duration').value,desc=n.querySelector('.exp-desc').value;
        if(role||org||dur||desc){
          const li=document.createElement('li');
          li.innerHTML=`<div class='font-medium text-gray-900'>${role}</div><div class='text-xs text-gray-600'>${org} · ${dur}</div><div class='text-xs text-gray-700'>${desc}</div>`;
          pvExp.appendChild(li);
        }
      });

      // Education
      const pvEdu = qs('#pvEdu');
      pvEdu.innerHTML='';
      qsa('#eduList .edu-item').forEach(n=>{
        const inst=n.querySelector('.edu-inst').value,deg=n.querySelector('.edu-degree').value,yr=n.querySelector('.edu-year').value;
        if(inst||deg||yr){
          const li=document.createElement('li');
          li.innerHTML=`<div class='font-medium text-gray-900'>${inst}</div><div class='text-xs text-gray-700'>${deg} · ${yr}</div>`;
          pvEdu.appendChild(li);
        }
      });

      // Skills
      const pvSkills=qs('#pvSkills');
      pvSkills.innerHTML='';
      qsa('#skillList .skill-item').forEach(n=>{
        const s=n.querySelector('.skill-input').value;
        if(s){
          const span=document.createElement('span');
          span.className='border px-2 py-1 rounded';
          span.textContent=s;
          pvSkills.appendChild(span);
        }
      });
    }

    document.body.addEventListener('input', e=>{
      if(e.target.matches('input,textarea')){updateProfile();refresh();}
    });

    qs('#downloadPdf').addEventListener('click', ()=>{
      const opt={margin:0.2,filename:(qs('#fullName').value||'ATS_Resume')+'.pdf',image:{type:'jpeg',quality:1},html2canvas:{scale:2},jsPDF:{unit:'in',format:'a4',orientation:'portrait'}};
      html2pdf().set(opt).from(qs('#preview')).save();
    });

    qs('#resetBtn').addEventListener('click', ()=>{
      if(!confirm('Reset all fields?')) return;
      qsa('input,textarea').forEach(i=>i.value='');
      qsa('#expList .exp-item,#eduList .edu-item,#skillList .skill-item').forEach(n=>n.remove());
      qs('#addExp').click();qs('#addEdu').click();qs('#addSkill').click();
      updateProfile();refresh();
    });

    updateProfile();refresh();
  </script>
</body>
</html>
