<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Designer — Portfolio Resume · ResumeSpark</title>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    @media print {.no-print{display:none!important;}}
    .gradient-text {
      background: linear-gradient(to right, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .preview-shadow {
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    .image-thumb {
      width: 100%; height: 140px; object-fit: cover; border-radius: 0.5rem;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-pink-50 via-white to-purple-50 text-gray-800">

  <!-- NAV -->
  <header class="no-print bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-r from-pink-500 to-purple-500 flex items-center justify-center text-white text-lg font-bold">DP</div>
        <div>
          <h1 class="text-lg font-semibold">ResumeSpark</h1>
          <p class="text-xs text-gray-500">Designer — Portfolio Theme</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button id="downloadPdf" class="bg-gradient-to-r from-pink-500 to-purple-600 hover:opacity-90 text-white px-4 py-2 rounded-full text-sm font-medium shadow">Download PDF</button>
        <button id="resetBtn" class="border border-gray-300 px-4 py-2 rounded-full text-sm">Reset</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto grid md:grid-cols-2 gap-8 p-6">

    <!-- LEFT INPUT SIDE -->
    <section class="space-y-6">

      <!-- Personal Info -->
      <div class="bg-white rounded-2xl p-6 shadow-sm">
        <h3 class="text-lg font-semibold gradient-text mb-3">Personal Information</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="flex flex-col items-center md:items-start">
            <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-pink-400">
              <img id="photoPreview" src="" alt="Photo" class="w-full h-full object-cover" />
            </div>
            <input id="photoInput" type="file" accept="image/*" class="mt-3 text-sm" />
          </div>
          <div class="col-span-2 space-y-2">
            <input id="fullName" placeholder="Full Name" class="w-full border p-2 rounded text-sm" />
            <input id="headline" placeholder="Creative Designer | Portfolio Specialist" class="w-full border p-2 rounded text-sm" />
            <textarea id="summary" rows="2" placeholder="Your creative vision, mission, or tagline..." class="w-full border p-2 rounded text-sm"></textarea>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <input id="email" placeholder="Email" class="border p-2 rounded text-sm" />
              <input id="phone" placeholder="Phone" class="border p-2 rounded text-sm" />
              <input id="location" placeholder="City, Country" class="border p-2 rounded text-sm" />
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <input id="linkedin" placeholder="LinkedIn" class="border p-2 rounded text-sm" />
              <input id="portfolio" placeholder="Portfolio / Behance" class="border p-2 rounded text-sm" />
              <input id="dribbble" placeholder="Dribbble / Instagram" class="border p-2 rounded text-sm" />
            </div>
          </div>
        </div>
      </div>

      <!-- Projects -->
      <div class="bg-white rounded-2xl p-6 shadow-sm">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-lg font-semibold gradient-text">Portfolio Projects</h3>
          <button id="addProj" class="text-pink-600 text-sm">+ Add</button>
        </div>
        <div id="projList" class="space-y-3">
          <template id="projTemplate">
            <div class="proj-item border rounded p-3">
              <input class="proj-title w-full border p-1 rounded mb-1 text-sm" placeholder="Project Title" />
              <textarea class="proj-desc w-full border p-1 rounded text-sm" rows="2" placeholder="Project details or creative process..."></textarea>
              <input class="proj-link w-full border p-1 rounded mb-1 text-sm" placeholder="Project Link (Behance / Dribbble)" />
              <input class="proj-img w-full border p-1 rounded text-sm" type="file" accept="image/*" />
              <div class="text-right mt-1"><button class="remove-proj text-red-500 text-xs">Remove</button></div>
            </div>
          </template>
        </div>
      </div>

      <!-- Skills -->
      <div class="bg-white rounded-2xl p-6 shadow-sm">
        <div class="flex justify-between items-center mb-2">
          <h3 class="text-lg font-semibold gradient-text">Skills</h3>
          <button id="addSkill" class="text-pink-600 text-sm">+ Add</button>
        </div>
        <div id="skillList" class="flex flex-wrap gap-2">
          <template id="skillTemplate">
            <div class="skill-item border rounded px-2 py-1 flex items-center gap-2">
              <input class="skill-input text-sm border-0 focus:outline-none" placeholder="Skill (e.g., Figma)" />
              <button class="remove-skill text-red-500 text-xs">×</button>
            </div>
          </template>
        </div>
      </div>

    </section>

    <!-- RIGHT PREVIEW SIDE -->
    <aside>
      <div id="preview" class="bg-white rounded-2xl p-6 preview-shadow border border-gray-200">
        <header class="border-b pb-4 mb-4">
          <div class="flex items-center gap-4">
            <div class="w-20 h-20 rounded-full overflow-hidden border-4 border-pink-400">
              <img id="pvPhoto" src="" alt="" class="w-full h-full object-cover" />
            </div>
            <div>
              <h1 id="pvName" class="text-2xl font-bold text-gray-900">Full Name</h1>
              <h2 id="pvHeadline" class="text-sm text-gray-600">Creative Designer</h2>
              <p id="pvSummary" class="text-sm mt-2 text-gray-700 leading-snug">Your creative vision will appear here.</p>
            </div>
          </div>
          <div class="mt-3 text-xs text-gray-700 space-y-1">
            <div id="pvEmail">email@example.com</div>
            <div id="pvPhone">+91 12345 67890</div>
            <div id="pvLocation">City, Country</div>
          </div>
          <div class="flex flex-wrap gap-2 mt-3 text-xs text-pink-600 underline">
            <a id="pvLinkedin" href="#">LinkedIn</a>
            <a id="pvPortfolio" href="#">Portfolio</a>
            <a id="pvDribbble" href="#">Dribbble</a>
          </div>
        </header>

        <section>
          <h3 class="text-lg font-semibold gradient-text mb-3">Portfolio Projects</h3>
          <ul id="pvProj" class="space-y-3"></ul>
        </section>

        <hr class="my-4" />

        <section>
          <h3 class="text-lg font-semibold gradient-text mb-2">Skills</h3>
          <div id="pvSkills" class="flex flex-wrap gap-2"></div>
        </section>
      </div>
    </aside>
  </main>

  <script>
    const qs=s=>document.querySelector(s),qsa=s=>document.querySelectorAll(s);

    function updateProfile(){
      qs('#pvName').textContent=qs('#fullName').value||'Full Name';
      qs('#pvHeadline').textContent=qs('#headline').value||'Creative Designer';
      qs('#pvSummary').textContent=qs('#summary').value||'Your creative vision will appear here.';
      qs('#pvEmail').textContent=qs('#email').value||'email@example.com';
      qs('#pvPhone').textContent=qs('#phone').value||'+91 12345 67890';
      qs('#pvLocation').textContent=qs('#location').value||'City, Country';
      qs('#pvLinkedin').href=qs('#linkedin').value||'#';
      qs('#pvPortfolio').href=qs('#portfolio').value||'#';
      qs('#pvDribbble').href=qs('#dribbble').value||'#';
    }

    const photoInput=qs('#photoInput'),photoPrev=qs('#photoPreview'),pvPhoto=qs('#pvPhoto');
    photoInput.addEventListener('change',e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();r.onload=ev=>{
        photoPrev.src=ev.target.result;pvPhoto.src=ev.target.result;
      };r.readAsDataURL(f);
    });

    function setup(addBtn,list,template,removeSel){
      const add=qs(addBtn),lst=qs(list),tmpl=qs(template);
      add.addEventListener('click',()=>{
        const n=tmpl.content.cloneNode(true);
        lst.appendChild(n);refresh();
      });
      lst.addEventListener('click',e=>{
        if(e.target.matches(removeSel)){e.target.closest('div').remove();refresh();}
      });
    }

    setup('#addProj','#projList','#projTemplate','.remove-proj');
    setup('#addSkill','#skillList','#skillTemplate','.remove-skill');
    qs('#addProj').click();qs('#addSkill').click();

    function refresh(){
      const pvProj=qs('#pvProj');pvProj.innerHTML='';
      qsa('#projList .proj-item').forEach(n=>{
        const t=n.querySelector('.proj-title').value,
              d=n.querySelector('.proj-desc').value,
              l=n.querySelector('.proj-link').value,
              img=n.querySelector('.proj-img').files[0];
        if(t||d){
          const li=document.createElement('li');
          li.className='border rounded p-3';
          li.innerHTML=`<div class='font-medium text-gray-900 mb-1'>${t}${l?` <a href='${l}' target='_blank' class='text-pink-600 underline text-xs'>[link]</a>`:''}</div><div class='text-xs text-gray-600 mb-2'>${d}</div>`;
          if(img){
            const reader=new FileReader();
            reader.onload=ev=>{
              const im=document.createElement('img');
              im.src=ev.target.result;im.className='image-thumb';
              li.appendChild(im);
            };
            reader.readAsDataURL(img);
          }
          pvProj.appendChild(li);
        }
      });

      const pvSkills=qs('#pvSkills');pvSkills.innerHTML='';
      qsa('#skillList .skill-item').forEach(i=>{
        const s=i.querySelector('.skill-input').value;
        if(s){
          const sp=document.createElement('span');
          sp.className='bg-pink-100 text-pink-700 px-3 py-1 rounded-full text-xs';
          sp.textContent=s;
          pvSkills.appendChild(sp);
        }
      });
    }

    document.body.addEventListener('input',e=>{
      if(e.target.matches('input,textarea')){updateProfile();refresh();}
    });

    qs('#downloadPdf').addEventListener('click',()=>{
      const opt={margin:0.2,filename:(qs('#fullName').value||'Designer_Portfolio')+'.pdf',image:{type:'jpeg',quality:1},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'in',format:'a4',orientation:'portrait'}};
      html2pdf().set(opt).from(qs('#preview')).save();
    });

    qs('#resetBtn').addEventListener('click',()=>{
      if(!confirm('Reset all fields?'))return;
      qsa('input,textarea').forEach(i=>i.value='');
      qsa('#projList .proj-item,#skillList .skill-item').forEach(n=>n.remove());
      qs('#addProj').click();qs('#addSkill').click();
      updateProfile();refresh();photoPrev.src='';pvPhoto.src='';
    });

    updateProfile();refresh();
  </script>
</body>
</html>
